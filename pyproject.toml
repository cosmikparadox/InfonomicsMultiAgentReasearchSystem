[project]
name = "infonomics-research-system"
version = "0.2.0"
description = "Multi-agent PhD-level research system for infonomics — operated by Claude Code"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
analysis = [
    "pandas>=2.0",
    "networkx>=3.0",
    "matplotlib>=3.8",
]

[project.scripts]
research-viewer = "src.viewer:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
